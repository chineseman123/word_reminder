name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 cmdline-tools 已下线 "tools" 包，默认安装会导致 sdkmanager 失败
          packages: 'platform-tools'

      - name: Install SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teleprompter-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 复制一份带提交号命名的 APK：Release 里同名文件会被覆盖，
      # 带版本号的副本会累积保留，历史版本随时可回滚下载
      - name: Prepare versioned APK copy
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/app-debug-${GITHUB_SHA::7}.apk"

      - name: Attach APK to Release
        uses: softprops/action-gh-release@v2
        with:
          # 推送 tag 时用 tag 名，普通推送则固定更新 v1.0.0 这个 Release
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug-*.apk
          fail_on_unmatched_files: true
